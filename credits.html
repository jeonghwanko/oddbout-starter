    // The page's language before the module boots — the same order as platform/localePreference (?lang, the saved pick, the browser,
    // English). test/locale-boot-scripts.test.ts runs this against resolveLocale.
    const bootLocale = (() => {
      const known = value => ["ko", "en", "ja"].includes(value) ? value : null;
      let saved = null;
      try { saved = localStorage.getItem("ai-fighter.creator.locale.v1"); } catch { /* the URL and the browser still decide */ }
      const browser = (navigator.languages && navigator.languages.length ? navigator.languages : [navigator.language]).map(tag => known(String(tag).split("-")[0].toLowerCase())).find(Boolean);
      const requested = new URLSearchParams(location.search).get("lang");
      if (requested === "qps") return "en"; // the development build's pseudo language reads English
      return known(requested) || known(saved) || browser || "en";
    })();
    document.documentElement.lang = bootLocale;
  </script>
