<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ODDBOUT ChatGPT Launcher</title>
<style>
:root{color-scheme:dark;font-family:system-ui,sans-serif}body{margin:0;background:#10131b;color:#fff}
main{max-width:1100px;margin:auto;padding:16px}.top{display:flex;justify-content:space-between;align-items:center}
button{background:#14b8a6;border:0;border-radius:8px;color:#071512;font-weight:700;padding:12px 18px;cursor:pointer}
button:disabled{opacity:.5;cursor:wait}.secondary{background:#303744;color:#fff}
#game{display:none;width:100%;height:min(75vh,720px);border:0;border-radius:12px;background:#000}
#status{color:#aab4c3;font-size:14px}#actions{display:flex;gap:8px;flex-wrap:wrap}
</style></head>
<body><main><div class="top"><h1>ODDBOUT</h1><span>ChatGPT Game Launcher · Preview</span></div>
<p id="status" role="status">게임 실행 준비 완료</p>
<div id="actions"><button id="start">게임 시작</button><button id="back" class="secondary" hidden>런처로 돌아가기</button><button id="expand" class="secondary">전체화면 요청</button></div>
<iframe id="game" title="ODDBOUT game" allow="autoplay; fullscreen; gamepad" referrerpolicy="strict-origin-when-cross-origin"></iframe>
</main>
<script type="module" src="./launcher.js"></script></body></html>
