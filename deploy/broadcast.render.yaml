# Separate hackathon services, never the production ai-fighter validator/gateway.
# Publish the reviewed changes before applying this Blueprint from main.
# Free is a preview starting point, not an availability guarantee for a 24-hour run.
services:
  - type: web
    name: oddbout-broadcast-sandbox
    runtime: node
    repo: https://github.com/jeonghwanko/oddbout-starter
    branch: main
    plan: free
    # The official PayPal MCP server (reconciliation) installs apart from the kit's dependencies.
    buildCommand: npm ci --omit=dev --ignore-scripts && npm ci --prefix deploy/paypal-mcp --omit=dev --ignore-scripts
    startCommand: node scripts/broadcast-demo.mjs
    healthCheckPath: /healthz
    autoDeployTrigger: "off"
    envVars:
      - key: NODE_VERSION
        value: 22.22.2
      - key: ODDBOUT_BROADCAST_BIND_HOST
        value: 0.0.0.0
      - key: ODDBOUT_COMMERCE_ORIGIN
        sync: false
      - key: ODDBOUT_COMMERCE_ENABLED
        value: "0"
      - key: ODDBOUT_PAID_OPERATIONS
        value: "0"
      - key: ODDBOUT_BROADCAST_HOST_IDS
        value: current-pc
      # Set to 1 together with the model and key to run producers automatically / serve the concierge.
      - key: ODDBOUT_BROADCAST_AUTO_PRODUCER
        value: "0"
      - key: ODDBOUT_BROADCAST_CONCIERGE
        value: "0"
      - key: ODDBOUT_PAYPAL_RECONCILIATION
        value: "0"
      - key: ODDBOUT_PAYOUTS
        value: "0"
      - key: ODDBOUT_PAYOUT_RECEIVERS_JSON
        sync: false
      - key: ODDBOUT_BROADCAST_MODEL
        sync: false
      - key: OPENAI_API_KEY
        sync: false
  - type: web
    name: oddbout-broadcast-arena
    runtime: static
    repo: https://github.com/jeonghwanko/oddbout-twitch-cup
    branch: main
    buildCommand: npm ci --include=dev && npm run build
    staticPublishPath: dist
    autoDeployTrigger: "off"
    envVars:
      - key: NODE_VERSION
        value: 22.22.2
