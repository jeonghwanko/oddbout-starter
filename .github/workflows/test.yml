# Pull requests to main, and main itself every three hours; main requires this check before a merge.
# Runs are batched (2026-11-07: one release ran this suite, about 11 minutes, five times; three hours of merges ran it
# eight times on main):
# - A draft pull request runs nothing. Marking it ready (`gh pr ready`) runs it at once.
# - A push to a ready pull request waits four minutes first. Another push in that time cancels the waiting run, so a burst
#   of pushes runs the suite once, on the last one.
# - Merges to main run nothing. Every three hours `gate` looks at main's head: when that commit already passed `test`, or
#   it merges a pull request head that passed `test` with the same tree, nothing runs; otherwise the suite runs once for
#   everything merged since. Run it at once with `gh workflow run test --ref main` (before a deploy, for example).
# A job skipped by its `if` reports success. A draft cannot merge, and marking it ready starts the real run.
# GitHub skips the run when a PR's last commit message carries a skip-ci marker anywhere, body included (this PR's
# first commit quoted it in an explanation and was skipped), and the required check then never reports.
# GitHub-hosted runners only: this repository is public, and a fork's pull request must not reach a self-hosted machine.
name: test
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  schedule:
    - cron: '23 */3 * * *' # main's head, at most once per three hours (GitHub may start it late)
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: test-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  # Every three hours on main: has this tree already passed `test`?
  gate:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read
      checks: read
    outputs:
      tested: ${{ steps.head.outputs.tested }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2 # main's head and its parents
      - id: head
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          passed() {
            n=$(gh api "repos/$GITHUB_REPOSITORY/commits/$1/check-runs?check_name=test&filter=latest" \
              --jq '[.check_runs[] | select(.conclusion == "success")] | length') || n=0
            [ "${n:-0}" -gt 0 ]
          }
          tested=false
          if passed "$GITHUB_SHA"; then
            tested=true; echo "$GITHUB_SHA already passed test: not run again."
          elif head=$(git rev-parse -q --verify HEAD^2) && [ "$(git rev-parse 'HEAD^{tree}')" = "$(git rev-parse "$head^{tree}")" ] \
            && passed "$head"; then
            tested=true; echo "Merges $head, which passed test with this tree: not run again."
          fi
          echo "tested=$tested" >> "$GITHUB_OUTPUT"
  test:
    needs: gate
    # needs + !cancelled(): runs where `gate` was skipped (pull requests, dispatch) or failed (then nothing is known).
    if: >-
      !cancelled()
      && !(github.event_name == 'pull_request' && github.event.pull_request.draft)
      && !(github.event_name == 'schedule' && needs.gate.outputs.tested == 'true')
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      # A newer push to the same pull request cancels this run here, before anything is installed (concurrency above).
      - name: wait for more pushes
        if: github.event_name == 'pull_request' && github.event.action == 'synchronize'
        run: sleep 240
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
      # A pull does not move the submodule, so a checkout left on an older pin shows `M vendor/sprite-gen` and `git add -A`
      # stages it as a rollback (2026-10-30). A pin moves only forward along sprite-gen-agent main; an engine revert is a
      # new sprite-gen-agent commit, pinned forward.
      - name: sprite-gen pin moves forward
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          git fetch -q --no-tags --depth=1 origin "$BASE"
          old=$(git rev-parse "$BASE:vendor/sprite-gen")
          new=$(git rev-parse "HEAD:vendor/sprite-gen")
          [ "$old" = "$new" ] && exit 0
          compare=repos/jeonghwanko/sprite-gen-agent/compare
          step=$(gh api "$compare/$old...$new" --jq .status)
          main=$(gh api "$compare/$new...main" --jq .status)
          if [ "$step" != ahead ]; then
            echo "::error file=vendor/sprite-gen::The pin goes from $old to $new ($step, not ahead). If the submodule was staged by accident: git restore --staged --source=origin/main vendor/sprite-gen, then commit."
            exit 1
          fi
          if [ "$main" != ahead ] && [ "$main" != identical ]; then
            echo "::error file=vendor/sprite-gen::$new is not on sprite-gen-agent main (main: $main). Merge the engine change there first, then move the pin."
            exit 1
          fi
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      # sprite:setup installs img2webp and RIFE itself; ffmpeg/ffprobe come from the system.
      - name: Ensure FFmpeg and ffprobe are available
        shell: bash
        run: |
          if ffmpeg -version >/dev/null 2>&1 && ffprobe -version >/dev/null 2>&1; then exit 0; fi
          source /etc/os-release
          list="$RUNNER_TEMP/ffmpeg-ubuntu.list"
          opts=(-o "Dir::Etc::sourcelist=$list" -o Dir::Etc::sourceparts=- -o APT::Get::List-Cleanup=0
                -o Acquire::Retries=1 -o Acquire::https::Timeout=20)
          # A runner whose resolver is not up yet fails both mirrors at once ("Temporary failure resolving", twice in a row on
          # 2026-11-11): go round the mirrors again after a pause before giving up.
          for round in 1 2 3 4; do
            for mirror in https://archive.ubuntu.com/ubuntu https://azure.archive.ubuntu.com/ubuntu; do
              for suite in "$VERSION_CODENAME" "$VERSION_CODENAME-updates" "$VERSION_CODENAME-security"; do
                echo "deb [signed-by=/usr/share/keyrings/ubuntu-archive-keyring.gpg] $mirror $suite main universe restricted multiverse"
              done > "$list"
              # Bound network waits only. Never interrupt dpkg while it installs the verified packages.
              if sudo timeout 90s apt-get "${opts[@]}" update &&
                 sudo timeout 180s apt-get "${opts[@]}" --download-only --no-install-recommends -y install ffmpeg; then
                sudo apt-get "${opts[@]}" --no-download --no-install-recommends -y install ffmpeg
                break 2
              fi
            done
            echo "ffmpeg: no mirror answered in round $round"
            sleep $((round * 20))
          done
          ffmpeg -version >/dev/null
          ffprobe -version >/dev/null
      - run: npm ci
      # Biome's lint (biome.json): errors fail, warnings are shown. Its formatter is off: no file has been formatted by it yet.
      - run: npm run lint
      - run: npm run sprite:setup
      - run: npm test
      # The Edge deploy does not type-check, and Deno's TypeScript can infer less than tsc (2026-10-30): check every Edge
      # function that has a deno.json with that config and its lock, as it is deployed.
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.8
      - run: for config in supabase/functions/*/deno.json; do deno check --frozen --config "$config" "$(dirname "$config")/index.ts"; done
