name: Publish verified Pages

on:
  workflow_dispatch:
    inputs:
      pages_sha:
        description: Full SHA of the verified codex/creator-pages commit
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: pages-publication
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    # Public repository; replaces the existing GitHub-managed Pages hosting job.
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: source
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.pages_sha }}
          path: site
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Verify artifact and publication revision
        env:
          PAGES_SHA: ${{ inputs.pages_sha }}
        run: |
          node --input-type=module -e "import assert from 'node:assert/strict'; import {verifyArtifact,git} from './source/scripts/hosting-lib.mjs'; assert.match(process.env.PAGES_SHA,/^[a-f0-9]{40}$/); assert.equal(git('site','rev-parse','HEAD'),process.env.PAGES_SHA); await verifyArtifact('site',{gitCheckout:true});"
          tar --directory site --exclude=.git --exclude=.github -cf "$RUNNER_TEMP/artifact.tar" .
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2, Node 24
        id: artifact
        with:
          name: github-pages
          path: ${{ runner.temp }}/artifact.tar
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
      - uses: actions/github-script@d746ffe35508b1917358783b479e04febd2b8f71 # v9.0.0, Node 24
        id: publish
        env:
          PAGES_SHA: ${{ inputs.pages_sha }}
          ARTIFACT_ID: ${{ steps.artifact.outputs.artifact-id }}
        with:
          script: |
            const {deployPages} = await import(`${process.env.GITHUB_WORKSPACE}/source/scripts/pages-deploy.mjs`);
            await deployPages({github,core,context},process.env.ARTIFACT_ID,process.env.PAGES_SHA);
      - name: Verify live pages and asset bytes
        run: node --input-type=module -e "import {verifyLiveSite} from './source/scripts/hosting-lib.mjs'; await verifyLiveSite('site');"
